[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.openssl", "php82Extensions.fileinfo", "php82Extensions.dom", "composer"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "php artisan config:clear",
    "php artisan cache:clear",
    "php artisan storage:link"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public"